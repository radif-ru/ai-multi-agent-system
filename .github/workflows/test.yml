name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: flake8 + pytest + gates + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tracked artifacts (files matching .gitignore)
        run: |
          tracked_ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            echo "ERROR: игнорируемые файлы попали в git:" >&2
            echo "$tracked_ignored" | sed 's/^/  - /' >&2
            exit 1
          fi

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Env sync (Settings ↔ .env.example)
        run: python -m scripts.check_env_sync

      - name: Sprint sync (plan.md ↔ sprint files)
        run: python -m scripts.check_sprint_sync

      - name: Doc links (relative links in markdown)
        run: python -m scripts.check_doc_links

      - name: Agents sync (skills/prompts format and mirrors)
        run: python .agents/skills/skill-authoring/scripts/check_agents_sync.py

      - name: Tests + coverage gate (pytest)
        env:
          TELEGRAM_BOT_TOKEN: dummy-token-for-ci
        # Порог покрытия (--cov-fail-under) задан в pyproject.toml addopts:
        # pytest падает (красный CI), если покрытие app/ ниже порога.
        run: pytest -q --cov-report=json:coverage.json

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Извлекаем процент покрытия из coverage.json
          COV=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "Coverage: ${COV}%"
          # Цвет бейджа по уровню покрытия
          if [ "$COV" -ge 90 ]; then COLOR="brightgreen"; elif [ "$COV" -ge 80 ]; then COLOR="green"; elif [ "$COV" -ge 70 ]; then COLOR="yellow"; else COLOR="red"; fi
          # Генерируем SVG-бейдж и сохраняем во /tmp (переживёт git checkout --orphan)
          cat > /tmp/coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="108" height="20"><linearGradient id="b" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><rect fill="#555" width="65" height="20"/><rect fill="#$COLOR" x="65" width="43" height="20"/><g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11"><text x="32.5" y="15">coverage</text><text x="86.5" y="15">${COV}%</text></g></svg>
          EOF
          # Создаём orphan-ветку coverage-badge (только coverage.svg, без остального репозитория)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --orphan coverage-badge
          git rm -rf .
          cp /tmp/coverage.svg coverage.svg
          git add coverage.svg
          git commit -m "chore: update coverage badge to ${COV}%"
          git push origin coverage-badge --force
