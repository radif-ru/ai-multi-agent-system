name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: flake8 + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Env sync (Settings ↔ .env.example)
        run: python -m scripts.check_env_sync

      - name: Sprint sync (plan.md ↔ sprint files)
        run: python -m scripts.check_sprint_sync

      - name: Doc links (relative links in markdown)
        run: python -m scripts.check_doc_links

      - name: Agents sync (skills/prompts format and mirrors)
        run: python .agents/skills/skill-authoring/scripts/check_agents_sync.py

      - name: Tests + coverage gate (pytest)
        env:
          TELEGRAM_BOT_TOKEN: dummy-token-for-ci
        # Порог покрытия (--cov-fail-under) задан в pyproject.toml addopts:
        # pytest падает (красный CI), если покрытие app/ ниже порога.
        run: pytest -q
